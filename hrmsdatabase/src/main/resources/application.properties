spring.application.name=hrmsdatabase
# ===================================================================
# H2 Database Datasource Configuration (In-Memory)
# ===================================================================
spring.datasource.url=jdbc:h2:mem:abeshrms
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=hcl123   

# ===================================================================
# H2 Console Configuration (Web Interface)
# ===================================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Prevents Spring Boot from generating a random, unique JDBC URL on every restart
spring.h2.console.generate-unique-name=false

# ===================================================================
# JPA / Hibernate Configurations
# ===================================================================
# Automatically creates, updates, or drops tables based on Entity classes
spring.jpa.hibernate.ddl-auto=update
# Specifies the H2 database platform for Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Prints SQL queries to the console log for easy debugging
spring.jpa.show-sql=true
